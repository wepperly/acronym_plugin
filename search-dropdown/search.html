<!DOCTYPE html>
<html>
  <head>
    <title>Quick Search</title>
    <link href="/styles/base.css" rel="stylesheet" type="text/css"></link>
    <link href="/styles/search.css" rel="stylesheet" type="text/css"></link>
  </head>
  <body class="nrao_acro_extension">
    <div id="nrao_acro_title">NRAO Acronym Finder</div>
    <form id="nrao_acro_search_form" autocomplete="off">
      <label>
        Enter an Acronym:
        <input id="nrao_acro_input" type="text" />
      </label>
      <button id="nrao_acro_submit" class="nrao_acro_submit">Search</button>
    </form>
    <ul id="nrao_acro_results"></ul>
    <script src="./search.js" type="module"></script>
  </body>
</html>
